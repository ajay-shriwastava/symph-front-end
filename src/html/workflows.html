<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflows — Symphony</title>
  <link rel="stylesheet" href="../css/symphony.css" />
</head>
<body>
  <div id="nav-root"></div>

  <main class="page" style="max-width:1300px;">
    <!-- ------------------------------------------------------------------ -->
    <!-- Page header + workflow list                                         -->
    <!-- ------------------------------------------------------------------ -->
    <div class="page-header">
      <h1 class="page-title">Workflows</h1>
      <button class="btn btn-primary" id="btn-new">+ New Workflow</button>
    </div>

    <!-- Create / rename form -->
    <div class="card" style="margin-bottom:20px;">
      <form id="workflow-meta-form" class="inline-form" autocomplete="off">
        <input type="hidden" id="form-wf-id" />
        <div class="form-group">
          <label for="f-name">Name *</label>
          <input id="f-name" type="text" required maxlength="255" placeholder="My Workflow" />
        </div>
        <div class="form-group" style="flex:2;">
          <label for="f-description">Description</label>
          <textarea id="f-description" placeholder="What does this workflow do?"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="form-submit-btn">Create</button>
          <button type="button" class="btn btn-secondary" id="btn-meta-cancel">Cancel</button>
        </div>
      </form>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Description</th>
              <th>Status</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="wf-tbody">
            <tr><td colspan="5" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <span class="pagination-info" id="page-info"></span>
        <div class="pagination-controls">
          <button class="btn btn-secondary btn-sm" id="btn-prev" disabled>Previous</button>
          <button class="btn btn-secondary btn-sm" id="btn-next" disabled>Next</button>
        </div>
      </div>
    </div>

    <!-- ------------------------------------------------------------------ -->
    <!-- Visual builder (shown when a workflow is open)                     -->
    <!-- ------------------------------------------------------------------ -->
    <div id="builder-section" style="display:none;">
      <div class="page-header" style="margin-bottom:12px;">
        <h2 class="page-title" id="builder-title" style="font-size:16px;"></h2>
        <button class="btn btn-secondary btn-sm" id="btn-close-builder">Close Builder</button>
      </div>

      <div class="builder-wrap">
        <!-- Toolbar -->
        <div class="builder-toolbar">
          <button class="btn btn-primary btn-sm" id="btn-save">Save</button>
          <button class="btn btn-secondary btn-sm" id="btn-run">Run</button>
          <span class="toolbar-sep"></span>
          <button class="btn btn-secondary btn-sm" id="btn-clear">Clear</button>
          <span class="toolbar-sep"></span>
          <button class="btn btn-secondary btn-sm" id="btn-zoom-in">+</button>
          <button class="btn btn-secondary btn-sm" id="btn-zoom-out">-</button>
          <button class="btn btn-secondary btn-sm" id="btn-zoom-reset">Fit</button>
          <span id="builder-status" style="margin-left:auto;font-size:12px;color:var(--text-tertiary);"></span>
        </div>

        <!-- Palette | Canvas | Config -->
        <div class="builder-body">
          <!-- Node palette -->
          <div class="node-palette" id="node-palette">
            <div class="palette-label">Nodes</div>
            <div class="palette-chip" data-type="start"     draggable="true">Start</div>
            <div class="palette-chip" data-type="agent"     draggable="true">Agent</div>
            <div class="palette-chip" data-type="condition" draggable="true">Condition</div>
            <div class="palette-chip" data-type="end"       draggable="true">End</div>
          </div>

          <!-- SVG Canvas -->
          <div class="canvas-wrap" id="canvas-wrap">
            <svg id="wf-svg" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                  <path d="M0,0 L0,6 L8,3 z" fill="var(--text-secondary)" />
                </marker>
                <marker id="arrow-selected" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                  <path d="M0,0 L0,6 L8,3 z" fill="var(--purple)" />
                </marker>
                <marker id="arrow-active" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                  <path d="M0,0 L0,6 L8,3 z" fill="var(--green)" />
                </marker>
              </defs>
              <!-- edges group rendered first (below nodes) -->
              <g id="edges-layer"></g>
              <!-- nodes group -->
              <g id="nodes-layer"></g>
              <!-- draft edge while drawing -->
              <path id="draft-edge" class="wf-edge-draft" style="display:none;" />
            </svg>
          </div>

          <!-- Config panel -->
          <div class="config-panel" id="config-panel">
            <h3>Properties</h3>
            <p class="config-panel-empty" id="config-empty">Select a node or edge.</p>
            <div id="config-fields" style="display:none;"></div>
          </div>
        </div>

        <!-- Run log -->
        <div class="run-log-wrap">
          <div class="run-log-header" id="run-log-toggle-btn">
            <span>Run Log</span>
            <span class="run-log-toggle" id="run-log-toggle-icon">&#9660;</span>
          </div>
          <div class="run-log-body" id="run-log-body" style="display:block;"></div>
        </div>

        <!-- Runs history -->
        <details class="runs-history" id="runs-history">
          <summary>Run History</summary>
          <div class="runs-history-body">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Run ID</th>
                    <th>Status</th>
                    <th>Started</th>
                    <th>Finished</th>
                  </tr>
                </thead>
                <tbody id="runs-tbody">
                  <tr><td colspan="4" class="empty-state">No runs yet.</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </details>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderNav, showToast } from "../js/nav.js";
    import {
      getAgents,
      getWorkflows, createWorkflow, updateWorkflow, deleteWorkflow,
      runWorkflow, getWorkflowRuns,
    } from "../js/api.js";

    document.getElementById("nav-root").innerHTML = renderNav("workflows.html");

    // -----------------------------------------------------------------------
    // Workflow list state
    // -----------------------------------------------------------------------
    const tbody    = document.getElementById("wf-tbody");
    const metaForm = document.getElementById("workflow-meta-form");
    const pageInfo = document.getElementById("page-info");
    const btnPrev  = document.getElementById("btn-prev");
    const btnNext  = document.getElementById("btn-next");
    const LIMIT = 20;
    let skip = 0;
    let total = 0;
    let editingMetaId = null;

    function truncate(str, n) {
      if (!str) return "";
      return str.length > n ? str.slice(0, n) + "…" : str;
    }

    function statusBadge(s) {
      const cls = { draft:"badge-grey", active:"badge-teal", archived:"badge-amber" }[s] || "badge-grey";
      const span = document.createElement("span");
      span.className = "badge " + cls;
      span.textContent = s || "draft";
      return span;
    }

    async function load() {
      try {
        const data = await getWorkflows(skip, LIMIT);
        total = data.total;
        renderTable(data.items);
        updatePagination();
      } catch (e) {
        showToast(e.message, "error");
      }
    }

    function renderTable(items) {
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No workflows found.</td></tr>';
        return;
      }
      tbody.innerHTML = "";
      for (const w of items) {
        const tr = document.createElement("tr");
        const tdName = document.createElement("td"); tdName.textContent = w.name;
        const tdDesc = document.createElement("td"); tdDesc.textContent = truncate(w.description, 55);
        const tdStatus = document.createElement("td"); tdStatus.appendChild(statusBadge(w.status));
        const tdCreated = document.createElement("td");
        tdCreated.textContent = new Date(w.created_at).toLocaleDateString();

        const tdActions = document.createElement("td");
        const openBtn = document.createElement("button");
        openBtn.className = "btn btn-secondary btn-sm";
        openBtn.textContent = "Open";
        openBtn.addEventListener("click", () => openBuilder(w));

        const renameBtn = document.createElement("button");
        renameBtn.className = "btn btn-secondary btn-sm";
        renameBtn.style.marginLeft = "4px";
        renameBtn.textContent = "Rename";
        renameBtn.addEventListener("click", () => openMetaEdit(w));

        const delBtn = document.createElement("button");
        delBtn.className = "btn btn-danger btn-sm";
        delBtn.style.marginLeft = "4px";
        delBtn.textContent = "Delete";
        delBtn.addEventListener("click", () => removeWorkflow(w.id, w.name));

        tdActions.append(openBtn, renameBtn, delBtn);
        tr.append(tdName, tdDesc, tdStatus, tdCreated, tdActions);
        tbody.appendChild(tr);
      }
    }

    function updatePagination() {
      const from = total === 0 ? 0 : skip + 1;
      const to = Math.min(skip + LIMIT, total);
      pageInfo.textContent = `Showing ${from}–${to} of ${total}`;
      btnPrev.disabled = skip === 0;
      btnNext.disabled = skip + LIMIT >= total;
    }

    function openMetaForm() { metaForm.classList.add("visible"); }
    function closeMetaForm() {
      metaForm.classList.remove("visible");
      metaForm.reset();
      document.getElementById("form-wf-id").value = "";
      editingMetaId = null;
      document.getElementById("form-submit-btn").textContent = "Create";
    }

    function openMetaEdit(wf) {
      editingMetaId = wf.id;
      document.getElementById("form-wf-id").value = wf.id;
      document.getElementById("f-name").value = wf.name;
      document.getElementById("f-description").value = wf.description || "";
      document.getElementById("form-submit-btn").textContent = "Update";
      openMetaForm();
      metaForm.scrollIntoView({ behavior: "smooth" });
    }

    async function removeWorkflow(id, name) {
      if (!confirm(`Delete workflow "${name}"?`)) return;
      try {
        await deleteWorkflow(id);
        showToast("Workflow deleted.");
        if (openWorkflowId === id) closeBuilder();
        await load();
      } catch (e) { showToast(e.message, "error"); }
    }

    metaForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        name: document.getElementById("f-name").value.trim(),
        description: document.getElementById("f-description").value.trim() || null,
      };
      try {
        if (editingMetaId) {
          await updateWorkflow(editingMetaId, payload);
          showToast("Workflow updated.");
        } else {
          await createWorkflow(payload);
          showToast("Workflow created.");
        }
        closeMetaForm();
        await load();
      } catch (e) { showToast(e.message, "error"); }
    });

    document.getElementById("btn-new").addEventListener("click", () => { closeMetaForm(); openMetaForm(); });
    document.getElementById("btn-meta-cancel").addEventListener("click", closeMetaForm);
    btnPrev.addEventListener("click", () => { skip = Math.max(0, skip - LIMIT); load(); });
    btnNext.addEventListener("click", () => { skip += LIMIT; load(); });

    // -----------------------------------------------------------------------
    // Builder state
    // -----------------------------------------------------------------------
    let openWorkflowId = null;
    let openWorkflowName = "";

    // Graph state
    let nodes = [];  // { id, type, x, y, label, agent_id?, true_label?, false_label? }
    let edges = [];  // { id, from, to, branch? }
    let selectedNodeId = null;
    let selectedEdgeId = null;

    // SVG transform
    let svgScale = 1;
    let svgPanX = 0;
    let svgPanY = 0;

    // Interaction state
    let draggingNodeId = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let drawingEdge = false;
    let drawingFromNodeId = null;
    let drawingFromPortBranch = null; // null | 'true' | 'false'

    const svg        = document.getElementById("wf-svg");
    const edgesLayer = document.getElementById("edges-layer");
    const nodesLayer = document.getElementById("nodes-layer");
    const draftEdge  = document.getElementById("draft-edge");

    let agentsList = [];  // loaded once per builder open

    // Node geometry constants
    const NODE = {
      start:     { w: 56, h: 56, rx: 28 },
      end:       { w: 56, h: 56, rx: 28 },
      agent:     { w: 130, h: 52, rx: 8 },
      condition: { w: 100, h: 52, rx: 4 },
    };

    // -----------------------------------------------------------------------
    // Open / close builder
    // -----------------------------------------------------------------------
    async function openBuilder(wf) {
      openWorkflowId = wf.id;
      openWorkflowName = wf.name;
      document.getElementById("builder-title").textContent = "Builder: " + wf.name;
      document.getElementById("builder-section").style.display = "block";
      document.getElementById("builder-section").scrollIntoView({ behavior: "smooth" });

      // Load graph_definition
      const gd = wf.graph_definition || {};
      nodes = JSON.parse(JSON.stringify(gd.nodes || []));
      edges = JSON.parse(JSON.stringify(gd.edges || []));
      selectedNodeId = null;
      selectedEdgeId = null;
      svgScale = 1; svgPanX = 0; svgPanY = 0;

      try {
        const res = await getAgents(0, 100);
        agentsList = res.items || [];
      } catch (_) { agentsList = []; }

      render();
      clearRunLog();
      await loadRunHistory();
    }

    function closeBuilder() {
      document.getElementById("builder-section").style.display = "none";
      openWorkflowId = null;
      nodes = []; edges = [];
      if (activeWs) { activeWs.close(); activeWs = null; }
    }

    document.getElementById("btn-close-builder").addEventListener("click", closeBuilder);

    // -----------------------------------------------------------------------
    // Render
    // -----------------------------------------------------------------------
    function render() {
      renderEdges();
      renderNodes();
      applyTransform();
    }

    function applyTransform() {
      nodesLayer.setAttribute("transform", `translate(${svgPanX},${svgPanY}) scale(${svgScale})`);
      edgesLayer.setAttribute("transform", `translate(${svgPanX},${svgPanY}) scale(${svgScale})`);
    }

    // -- Nodes ---------------------------------------------------------------
    function nodeGeom(node) {
      const g = NODE[node.type] || NODE.agent;
      return {
        cx: node.x + g.w / 2,
        cy: node.y + g.h / 2,
        w: g.w,
        h: g.h,
        rx: g.rx,
      };
    }

    function portPositions(node) {
      const g = nodeGeom(node);
      const ports = {
        in:  { x: node.x,           y: g.cy },
        out: { x: node.x + g.w,     y: g.cy },
      };
      if (node.type === "condition") {
        ports.true  = { x: node.x + g.w,     y: node.y + g.h * 0.25, branch: "true"  };
        ports.false = { x: node.x + g.w,     y: node.y + g.h * 0.75, branch: "false" };
        delete ports.out;
      }
      return ports;
    }

    function renderNodes() {
      nodesLayer.innerHTML = "";
      for (const node of nodes) {
        const g = createNodeElement(node);
        nodesLayer.appendChild(g);
      }
    }

    function createNodeElement(node) {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.setAttribute("class", "wf-node" + (selectedNodeId === node.id ? " selected" : ""));
      g.dataset.nodeId = node.id;

      const geom = nodeGeom(node);

      if (node.type === "start" || node.type === "end") {
        // Circle
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("class", "node-body");
        circle.setAttribute("cx", geom.cx);
        circle.setAttribute("cy", geom.cy);
        circle.setAttribute("r", geom.rx);
        circle.setAttribute("fill", "var(--purple)");
        circle.setAttribute("stroke", selectedNodeId === node.id ? "var(--purple)" : "rgba(83,74,183,0.3)");
        circle.setAttribute("stroke-width", "2");
        g.appendChild(circle);
      } else if (node.type === "condition") {
        // Diamond (rotated rect)
        const hw = geom.w / 2;
        const hh = geom.h / 2;
        const cx = node.x + hw;
        const cy = node.y + hh;
        const pts = `${cx},${node.y} ${node.x + geom.w},${cy} ${cx},${node.y + geom.h} ${node.x},${cy}`;
        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        poly.setAttribute("class", "node-body");
        poly.setAttribute("points", pts);
        poly.setAttribute("fill", "var(--amber-dim)");
        poly.setAttribute("stroke", selectedNodeId === node.id ? "var(--purple)" : "var(--amber)");
        poly.setAttribute("stroke-width", "1.5");
        g.appendChild(poly);
      } else {
        // Rounded rect
        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("class", "node-body");
        rect.setAttribute("x", node.x);
        rect.setAttribute("y", node.y);
        rect.setAttribute("width", geom.w);
        rect.setAttribute("height", geom.h);
        rect.setAttribute("rx", geom.rx);
        rect.setAttribute("fill", "#fff");
        rect.setAttribute("stroke", selectedNodeId === node.id ? "var(--purple)" : "var(--teal)");
        rect.setAttribute("stroke-width", "1.5");
        g.appendChild(rect);
      }

      // Label
      const lbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
      lbl.setAttribute("class", "node-label");
      lbl.setAttribute("x", geom.cx);
      lbl.setAttribute("y", geom.cy + (node.type === "start" || node.type === "end" ? 4 : 1));
      lbl.setAttribute("text-anchor", "middle");
      lbl.setAttribute("dominant-baseline", "middle");
      lbl.setAttribute("fill", node.type === "start" || node.type === "end" ? "#fff" : "var(--text-primary)");
      lbl.textContent = node.label || node.type;
      g.appendChild(lbl);

      // Type sub-label for agent nodes
      if (node.type === "agent") {
        const sub = document.createElementNS("http://www.w3.org/2000/svg", "text");
        sub.setAttribute("class", "node-type-label");
        sub.setAttribute("x", geom.cx);
        sub.setAttribute("y", node.y + geom.h - 6);
        sub.setAttribute("text-anchor", "middle");
        sub.textContent = "agent";
        g.appendChild(sub);
      }

      // Ports
      const ports = portPositions(node);
      const portEntries = Object.entries(ports);
      for (const [portKey, pos] of portEntries) {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("class", "port" + (portKey === "in" ? " port-in" : ""));
        c.setAttribute("cx", pos.x);
        c.setAttribute("cy", pos.y);
        c.setAttribute("r", "5");
        c.dataset.nodeId = node.id;
        c.dataset.portKey = portKey;
        if (pos.branch) c.dataset.branch = pos.branch;

        if (portKey !== "in") {
          c.addEventListener("mousedown", onPortMouseDown);
        }
        g.appendChild(c);
      }

      // Drag on node body
      g.addEventListener("mousedown", onNodeMouseDown);
      g.addEventListener("click", onNodeClick);

      return g;
    }

    // -- Edges ---------------------------------------------------------------
    function edgePath(fromNode, toNode, branch) {
      const fromPorts = portPositions(fromNode);
      let fp;
      if (fromNode.type === "condition" && branch) {
        fp = fromPorts[branch] || fromPorts.true;
      } else {
        fp = fromPorts.out || fromPorts.true;
      }
      const tp = portPositions(toNode).in;

      const dx = Math.abs(tp.x - fp.x) * 0.5;
      return `M ${fp.x} ${fp.y} C ${fp.x + dx} ${fp.y}, ${tp.x - dx} ${tp.y}, ${tp.x} ${tp.y}`;
    }

    function renderEdges() {
      edgesLayer.innerHTML = "";
      for (const edge of edges) {
        const fromNode = nodes.find(n => n.id === edge.from);
        const toNode   = nodes.find(n => n.id === edge.to);
        if (!fromNode || !toNode) continue;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        const isSelected = selectedEdgeId === edge.id;
        path.setAttribute("class", "wf-edge" + (isSelected ? " selected" : ""));
        path.setAttribute("d", edgePath(fromNode, toNode, edge.branch));
        path.setAttribute("marker-end", `url(#${isSelected ? "arrow-selected" : "arrow"})`);
        path.dataset.edgeId = edge.id;
        path.addEventListener("click", onEdgeClick);

        edgesLayer.appendChild(path);

        // Branch label
        if (edge.branch) {
          const fromPorts = portPositions(fromNode);
          const fp = fromPorts[edge.branch] || fromPorts.true;
          const lbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
          lbl.setAttribute("class", "edge-branch-label");
          lbl.setAttribute("x", fp.x + 8);
          lbl.setAttribute("y", fp.y - 4);
          lbl.textContent = edge.branch;
          edgesLayer.appendChild(lbl);
        }
      }
    }

    // -----------------------------------------------------------------------
    // Interaction: node drag
    // -----------------------------------------------------------------------
    function onNodeMouseDown(e) {
      if (e.target.classList.contains("port")) return; // handled by port handler
      e.preventDefault();
      const nodeId = e.currentTarget.dataset.nodeId;
      draggingNodeId = nodeId;
      const node = nodes.find(n => n.id === nodeId);
      const svgPt = svgPoint(e);
      dragOffsetX = svgPt.x - node.x;
      dragOffsetY = svgPt.y - node.y;
    }

    function onNodeClick(e) {
      if (drawingEdge) return;
      e.stopPropagation();
      const nodeId = e.currentTarget.dataset.nodeId;
      selectedNodeId = nodeId;
      selectedEdgeId = null;
      render();
      showNodeConfig(nodes.find(n => n.id === nodeId));
    }

    // -----------------------------------------------------------------------
    // Interaction: edge drawing
    // -----------------------------------------------------------------------
    function onPortMouseDown(e) {
      e.preventDefault();
      e.stopPropagation();
      drawingEdge = true;
      drawingFromNodeId = e.currentTarget.dataset.nodeId;
      drawingFromPortBranch = e.currentTarget.dataset.branch || null;
      draftEdge.style.display = "block";
    }

    // -----------------------------------------------------------------------
    // Interaction: edge click
    // -----------------------------------------------------------------------
    function onEdgeClick(e) {
      if (drawingEdge) return;
      e.stopPropagation();
      const edgeId = e.currentTarget.dataset.edgeId;
      selectedEdgeId = edgeId;
      selectedNodeId = null;
      render();
      showEdgeConfig(edges.find(ed => ed.id === edgeId));
    }

    // -----------------------------------------------------------------------
    // SVG mouse events (pan, drag, drop edge)
    // -----------------------------------------------------------------------
    function svgPoint(e) {
      const rect = svg.getBoundingClientRect();
      return {
        x: (e.clientX - rect.left - svgPanX) / svgScale,
        y: (e.clientY - rect.top  - svgPanY) / svgScale,
      };
    }

    function svgPointRaw(e) {
      const rect = svg.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    svg.addEventListener("mousedown", (e) => {
      if (e.target === svg || e.target.id === "wf-svg") {
        if (!drawingEdge) {
          isPanning = true;
          panStartX = e.clientX - svgPanX;
          panStartY = e.clientY - svgPanY;
        }
      }
    });

    svg.addEventListener("mousemove", (e) => {
      if (draggingNodeId) {
        const pt = svgPoint(e);
        const node = nodes.find(n => n.id === draggingNodeId);
        if (node) {
          node.x = pt.x - dragOffsetX;
          node.y = pt.y - dragOffsetY;
          render();
        }
      } else if (isPanning) {
        svgPanX = e.clientX - panStartX;
        svgPanY = e.clientY - panStartY;
        applyTransform();
      }

      if (drawingEdge && drawingFromNodeId) {
        const fromNode = nodes.find(n => n.id === drawingFromNodeId);
        if (!fromNode) return;
        const fromPorts = portPositions(fromNode);
        let fp;
        if (fromNode.type === "condition" && drawingFromPortBranch) {
          fp = fromPorts[drawingFromPortBranch] || fromPorts.true;
        } else {
          fp = fromPorts.out || fromPorts.true;
        }
        const raw = svgPointRaw(e);
        const tx = (raw.x - svgPanX) / svgScale;
        const ty = (raw.y - svgPanY) / svgScale;
        const dx = Math.abs(tx - fp.x) * 0.5;
        draftEdge.setAttribute("d",
          `M ${fp.x} ${fp.y} C ${fp.x + dx} ${fp.y}, ${tx - dx} ${ty}, ${tx} ${ty}`
        );
      }
    });

    svg.addEventListener("mouseup", (e) => {
      draggingNodeId = null;
      isPanning = false;

      if (drawingEdge) {
        draftEdge.style.display = "none";
        drawingEdge = false;

        // Check if mouse released on an input port
        const el = document.elementFromPoint(e.clientX, e.clientY);
        if (el && el.classList.contains("port") && el.dataset.portKey === "in") {
          const toNodeId = el.dataset.nodeId;
          if (toNodeId !== drawingFromNodeId) {
            addEdge(drawingFromNodeId, toNodeId, drawingFromPortBranch);
          }
        }
        drawingFromNodeId = null;
        drawingFromPortBranch = null;
      }
    });

    // Deselect on canvas click
    svg.addEventListener("click", (e) => {
      if (e.target === svg || e.target.id === "wf-svg") {
        selectedNodeId = null;
        selectedEdgeId = null;
        render();
        clearConfigPanel();
      }
    });

    // Wheel zoom
    document.getElementById("canvas-wrap").addEventListener("wheel", (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      svgScale = Math.min(3, Math.max(0.2, svgScale * delta));
      applyTransform();
    }, { passive: false });

    // Delete key
    document.addEventListener("keydown", (e) => {
      if ((e.key === "Delete" || e.key === "Backspace") &&
           !["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)) {
        if (selectedNodeId) { removeNode(selectedNodeId); }
        else if (selectedEdgeId) { removeEdge(selectedEdgeId); }
      }
    });

    // -----------------------------------------------------------------------
    // Drag-from-palette (HTML drag API)
    // -----------------------------------------------------------------------
    let paletteDragType = null;

    document.querySelectorAll(".palette-chip").forEach(chip => {
      chip.addEventListener("dragstart", (e) => {
        paletteDragType = chip.dataset.type;
        e.dataTransfer.effectAllowed = "copy";
      });
    });

    document.getElementById("canvas-wrap").addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
    });

    document.getElementById("canvas-wrap").addEventListener("drop", (e) => {
      e.preventDefault();
      if (!paletteDragType) return;
      const rect = svg.getBoundingClientRect();
      const x = (e.clientX - rect.left - svgPanX) / svgScale;
      const y = (e.clientY - rect.top  - svgPanY) / svgScale;
      addNode(paletteDragType, x - (NODE[paletteDragType]?.w || 80) / 2, y - (NODE[paletteDragType]?.h || 52) / 2);
      paletteDragType = null;
    });

    // -----------------------------------------------------------------------
    // Graph mutations
    // -----------------------------------------------------------------------
    function genId(prefix) {
      return prefix + "_" + Math.random().toString(36).slice(2, 7);
    }

    function addNode(type, x, y) {
      const labels = { start:"Start", end:"End", agent:"Agent", condition:"Check" };
      const node = { id: genId(type), type, x, y, label: labels[type] || type };
      nodes.push(node);
      render();
      selectedNodeId = node.id;
      selectedEdgeId = null;
      render();
      showNodeConfig(node);
    }

    function addEdge(fromId, toId, branch) {
      // Prevent duplicate
      const dup = edges.find(e => e.from === fromId && e.to === toId && (e.branch || null) === (branch || null));
      if (dup) return;
      const edge = { id: genId("e"), from: fromId, to: toId };
      if (branch) edge.branch = branch;
      edges.push(edge);
      render();
    }

    function removeNode(id) {
      nodes = nodes.filter(n => n.id !== id);
      edges = edges.filter(e => e.from !== id && e.to !== id);
      selectedNodeId = null;
      render();
      clearConfigPanel();
    }

    function removeEdge(id) {
      edges = edges.filter(e => e.id !== id);
      selectedEdgeId = null;
      render();
      clearConfigPanel();
    }

    // -----------------------------------------------------------------------
    // Config panel
    // -----------------------------------------------------------------------
    function clearConfigPanel() {
      document.getElementById("config-empty").style.display = "block";
      document.getElementById("config-fields").style.display = "none";
      document.getElementById("config-fields").innerHTML = "";
    }

    function showNodeConfig(node) {
      if (!node) return;
      const empty = document.getElementById("config-empty");
      const fields = document.getElementById("config-fields");
      empty.style.display = "none";
      fields.style.display = "block";
      fields.innerHTML = "";

      // Label field (all node types)
      const lblField = makeConfigField("Label", "text", node.label, (val) => {
        node.label = val;
        render();
      });
      fields.appendChild(lblField);

      if (node.type === "agent") {
        // Agent picker
        const sel = document.createElement("select");
        sel.style.cssText = "padding:6px 8px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:12px;font-family:var(--font);background:var(--bg-base);width:100%;margin-top:4px;";
        const blank = document.createElement("option");
        blank.value = "";
        blank.textContent = "— select agent —";
        sel.appendChild(blank);
        for (const a of agentsList) {
          const opt = document.createElement("option");
          opt.value = a.id;
          opt.textContent = a.name;
          if (a.id === node.agent_id) opt.selected = true;
          sel.appendChild(opt);
        }
        sel.addEventListener("change", () => {
          node.agent_id = sel.value || undefined;
          // Update label to agent name if empty
          if (sel.value) {
            const a = agentsList.find(ag => ag.id === sel.value);
            if (a && (!node.label || node.label === "Agent")) {
              node.label = a.name;
              render();
              showNodeConfig(node);
              return;
            }
          }
        });
        const agentDiv = document.createElement("div");
        agentDiv.className = "config-field";
        const agentLbl = document.createElement("label");
        agentLbl.textContent = "Agent";
        agentDiv.appendChild(agentLbl);
        agentDiv.appendChild(sel);
        fields.appendChild(agentDiv);
      }

      if (node.type === "condition") {
        const tfField = makeConfigField("True label", "text", node.true_label || "Yes", (val) => {
          node.true_label = val;
        });
        const ffField = makeConfigField("False label", "text", node.false_label || "No", (val) => {
          node.false_label = val;
        });
        fields.appendChild(tfField);
        fields.appendChild(ffField);
      }

      // Delete button
      const delBtn = document.createElement("button");
      delBtn.className = "btn btn-danger btn-sm config-delete-btn";
      delBtn.textContent = "Delete Node";
      delBtn.addEventListener("click", () => removeNode(node.id));
      fields.appendChild(delBtn);
    }

    function showEdgeConfig(edge) {
      if (!edge) return;
      const empty = document.getElementById("config-empty");
      const fields = document.getElementById("config-fields");
      empty.style.display = "none";
      fields.style.display = "block";
      fields.innerHTML = "";

      const info = document.createElement("div");
      info.className = "config-field";
      const infoLbl = document.createElement("label");
      infoLbl.textContent = "Edge";
      const infoVal = document.createElement("span");
      infoVal.style.fontSize = "11px";
      infoVal.style.color = "var(--text-secondary)";
      infoVal.textContent = edge.from + " → " + edge.to + (edge.branch ? ` (${edge.branch})` : "");
      info.appendChild(infoLbl);
      info.appendChild(infoVal);
      fields.appendChild(info);

      const delBtn = document.createElement("button");
      delBtn.className = "btn btn-danger btn-sm config-delete-btn";
      delBtn.textContent = "Delete Edge";
      delBtn.addEventListener("click", () => removeEdge(edge.id));
      fields.appendChild(delBtn);
    }

    function makeConfigField(label, inputType, value, onChange) {
      const div = document.createElement("div");
      div.className = "config-field";
      const lbl = document.createElement("label");
      lbl.textContent = label;
      const inp = document.createElement("input");
      inp.type = inputType;
      inp.value = value || "";
      inp.addEventListener("input", () => onChange(inp.value));
      div.appendChild(lbl);
      div.appendChild(inp);
      return div;
    }

    // -----------------------------------------------------------------------
    // Toolbar actions
    // -----------------------------------------------------------------------
    document.getElementById("btn-save").addEventListener("click", async () => {
      if (!openWorkflowId) return;
      const graph_definition = { nodes: JSON.parse(JSON.stringify(nodes)), edges: JSON.parse(JSON.stringify(edges)) };
      try {
        await updateWorkflow(openWorkflowId, { graph_definition });
        document.getElementById("builder-status").textContent = "Saved";
        setTimeout(() => { document.getElementById("builder-status").textContent = ""; }, 2000);
        showToast("Workflow saved.");
        await load();
      } catch (e) { showToast(e.message, "error"); }
    });

    document.getElementById("btn-run").addEventListener("click", async () => {
      if (!openWorkflowId) return;
      try {
        const runResp = await runWorkflow(openWorkflowId, {});
        clearRunLog();
        appendRunLog(`Run started: ${runResp.id}`, "log-enter");
        openRunWebSocket(openWorkflowId, runResp.id);
        await loadRunHistory();
      } catch (e) { showToast(e.message, "error"); }
    });

    document.getElementById("btn-clear").addEventListener("click", () => {
      if (!confirm("Clear all nodes and edges?")) return;
      nodes = [];
      edges = [];
      selectedNodeId = null;
      selectedEdgeId = null;
      render();
      clearConfigPanel();
    });

    document.getElementById("btn-zoom-in").addEventListener("click", () => {
      svgScale = Math.min(3, svgScale * 1.2);
      applyTransform();
    });
    document.getElementById("btn-zoom-out").addEventListener("click", () => {
      svgScale = Math.max(0.2, svgScale / 1.2);
      applyTransform();
    });
    document.getElementById("btn-zoom-reset").addEventListener("click", () => {
      svgScale = 1; svgPanX = 0; svgPanY = 0;
      applyTransform();
    });

    // -----------------------------------------------------------------------
    // Run log
    // -----------------------------------------------------------------------
    function clearRunLog() {
      document.getElementById("run-log-body").innerHTML = "";
    }

    function appendRunLog(text, cls) {
      const div = document.createElement("div");
      div.className = "log-line " + (cls || "");
      div.textContent = text;
      const body = document.getElementById("run-log-body");
      body.appendChild(div);
      body.scrollTop = body.scrollHeight;
    }

    document.getElementById("run-log-toggle-btn").addEventListener("click", () => {
      const body = document.getElementById("run-log-body");
      const icon = document.getElementById("run-log-toggle-icon");
      const isVisible = body.style.display !== "none";
      body.style.display = isVisible ? "none" : "block";
      icon.innerHTML = isVisible ? "&#9650;" : "&#9660;";
    });

    // -----------------------------------------------------------------------
    // WebSocket run streaming
    // -----------------------------------------------------------------------
    let activeWs = null;

    function openRunWebSocket(workflowId, runId) {
      if (activeWs) { activeWs.close(); activeWs = null; }
      const token = localStorage.getItem("symphony_token") || "dev-token";
      const wsUrl = `ws://127.0.0.1:8000/ws/workflows/${workflowId}/runs/${runId}?token=${token}`;
      const ws = new WebSocket(wsUrl);
      activeWs = ws;

      ws.addEventListener("open", () => {
        appendRunLog("WebSocket connected.", "log-enter");
      });

      ws.addEventListener("message", (ev) => {
        let msg;
        try { msg = JSON.parse(ev.data); } catch (_) { return; }

        const ts = msg.ts ? new Date(msg.ts).toLocaleTimeString() : "";

        switch (msg.event) {
          case "node_enter":
            appendRunLog(`[${ts}] ENTER  node:${msg.node_id}`, "log-enter");
            highlightNode(msg.node_id, "run-active");
            break;
          case "node_complete":
            appendRunLog(`[${ts}] DONE   node:${msg.node_id}`, "log-complete");
            highlightNode(msg.node_id, "run-complete");
            break;
          case "edge_traverse":
            appendRunLog(`[${ts}] EDGE   ${msg.edge_id}`, "log-edge");
            highlightEdge(msg.edge_id);
            break;
          case "run_complete":
            appendRunLog(`[${ts}] RUN COMPLETE — status:${msg.status}`, "log-done");
            ws.close();
            loadRunHistory();
            break;
          case "run_error":
            appendRunLog(`[${ts}] ERROR  ${msg.error}`, "log-error");
            ws.close();
            loadRunHistory();
            break;
        }
      });

      ws.addEventListener("close", () => {
        appendRunLog("WebSocket closed.", "log-edge");
      });

      ws.addEventListener("error", () => {
        appendRunLog("WebSocket error.", "log-error");
      });
    }

    function highlightNode(nodeId, cls) {
      const el = nodesLayer.querySelector(`[data-node-id="${nodeId}"]`);
      if (!el) return;
      el.classList.remove("run-active", "run-complete");
      el.classList.add(cls);
      setTimeout(() => el.classList.remove(cls), 3000);
    }

    function highlightEdge(edgeId) {
      const el = edgesLayer.querySelector(`[data-edge-id="${edgeId}"]`);
      if (!el) return;
      el.classList.add("run-active");
      setTimeout(() => el.classList.remove("run-active"), 2000);
    }

    // -----------------------------------------------------------------------
    // Run history
    // -----------------------------------------------------------------------
    async function loadRunHistory() {
      if (!openWorkflowId) return;
      try {
        const data = await getWorkflowRuns(openWorkflowId, 0, 20);
        renderRunHistory(data.items || []);
      } catch (_) {}
    }

    function renderRunHistory(items) {
      const tbody = document.getElementById("runs-tbody");
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No runs yet.</td></tr>';
        return;
      }
      tbody.innerHTML = "";
      for (const r of items) {
        const tr = document.createElement("tr");
        const tdId = document.createElement("td");
        tdId.textContent = r.id.slice(0, 8) + "…";
        tdId.title = r.id;

        const tdStatus = document.createElement("td");
        const badgeCls = { pending:"badge-grey", running:"badge-blue", completed:"badge-teal", failed:"badge-red" }[r.status] || "badge-grey";
        const badge = document.createElement("span");
        badge.className = "badge " + badgeCls;
        badge.textContent = r.status;
        tdStatus.appendChild(badge);

        const tdStarted = document.createElement("td");
        tdStarted.textContent = r.started_at ? new Date(r.started_at).toLocaleTimeString() : "—";

        const tdFinished = document.createElement("td");
        tdFinished.textContent = r.finished_at ? new Date(r.finished_at).toLocaleTimeString() : "—";

        tr.append(tdId, tdStatus, tdStarted, tdFinished);
        tbody.appendChild(tr);
      }
    }

    // -----------------------------------------------------------------------
    // Boot
    // -----------------------------------------------------------------------
    load();
  </script>
</body>
</html>
