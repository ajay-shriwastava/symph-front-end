<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agents — Symphony</title>
  <link rel="stylesheet" href="../css/symphony.css" />
</head>
<body>
  <div id="nav-root"></div>

  <main class="page">
    <div class="page-header">
      <h1 class="page-title">Agents</h1>
      <button class="btn btn-primary" id="btn-new">+ New Agent</button>
    </div>

    <div class="card">
      <!-- Inline form -->
      <form id="agent-form" class="inline-form" autocomplete="off">
        <input type="hidden" id="form-agent-id" />
        <div class="form-group">
          <label for="f-name">Name *</label>
          <input id="f-name" type="text" required maxlength="255" placeholder="My Agent" />
        </div>
        <div class="form-group">
          <label for="f-role-persona">Role &amp; Persona <span class="field-hint" title="The character and identity of the agent — defines its tone, personality, and perspective. E.g. 'You are a friendly support agent with deep product knowledge.'"></span></label>
          <textarea id="f-role-persona" placeholder="You are a friendly customer support agent..."></textarea>
        </div>
        <div class="form-group">
          <label for="f-model">Model <span class="field-hint" title="The LLM that powers this agent. Pick from the list or type a custom model ID."></span></label>
          <input id="f-model" type="text" list="model-options" maxlength="100" placeholder="claude-sonnet-4-6" />
          <datalist id="model-options">
            <option value="claude-sonnet-4-6"></option>
            <option value="claude-opus-4-6"></option>
            <option value="claude-haiku-4-5-20251001"></option>
            <option value="gpt-4o"></option>
            <option value="gpt-4o-mini"></option>
            <option value="gemini-1.5-pro"></option>
          </datalist>
        </div>
        <div class="form-group">
          <label for="f-description">Description <span class="field-hint" title="Human-facing summary of what this agent does and when to use it. Shown in the UI and used by orchestrators to route tasks to the right agent."></span></label>
          <textarea id="f-description" placeholder="What does this agent do and when should it be used?"></textarea>
        </div>
        <div class="form-group">
          <label for="f-system-prompt">System Prompt <span class="field-hint" title="Full runtime instructions sent to the LLM at the start of every conversation — responsibilities, decision rules, output format, and edge cases."></span></label>
          <textarea id="f-system-prompt" placeholder="You are a helpful assistant..."></textarea>
        </div>
        <div class="form-group">
          <label for="f-tools">Tools <span class="field-hint" title="Comma-separated list of tools this agent can use, e.g. web_search, code_exec."></span></label>
          <input id="f-tools" type="text" placeholder="web_search, code_exec, send_email" />
        </div>
        <div class="form-group form-group-full">
          <label>Channels</label>
          <div class="channel-options">
            <label class="channel-option"><input type="checkbox" name="channel" value="whatsapp" /> WhatsApp</label>
            <label class="channel-option"><input type="checkbox" name="channel" value="slack" /> Slack</label>
            <label class="channel-option"><input type="checkbox" name="channel" value="telegram" /> Telegram</label>
            <label class="channel-option"><input type="checkbox" name="channel" value="email" /> Email</label>
          </div>
        </div>
        <div class="form-group checkbox-group">
          <input id="f-memory" type="checkbox" />
          <label for="f-memory">Memory Enabled</label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="form-submit-btn">Create</button>
          <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
        </div>
      </form>

      <!-- Table -->
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Model</th>
              <th>Memory</th>
              <th>Created</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="agents-tbody">
            <tr><td colspan="5" class="empty-state">Loading...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination">
        <span class="pagination-info" id="page-info"></span>
        <div class="pagination-controls">
          <button class="btn btn-secondary btn-sm" id="btn-prev" disabled>Previous</button>
          <button class="btn btn-secondary btn-sm" id="btn-next" disabled>Next</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderNav, showToast } from "../js/nav.js";
    import { getAgents, createAgent, updateAgent, deleteAgent } from "../js/api.js";

    document.getElementById("nav-root").innerHTML = renderNav("agents.html");

    const tbody = document.getElementById("agents-tbody");
    const form = document.getElementById("agent-form");
    const pageInfo = document.getElementById("page-info");
    const btnPrev = document.getElementById("btn-prev");
    const btnNext = document.getElementById("btn-next");

    const LIMIT = 20;
    let skip = 0;
    let total = 0;
    let editingId = null;

    async function load() {
      try {
        const data = await getAgents(skip, LIMIT);
        total = data.total;
        renderTable(data.items);
        updatePagination();
      } catch (e) {
        showToast(e.message, "error");
      }
    }

    const CHANNEL_LABELS = { whatsapp: "WhatsApp", slack: "Slack", telegram: "Telegram", email: "Email" };

    function renderTable(items) {
      if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No agents found.</td></tr>';
        return;
      }
      tbody.innerHTML = "";
      for (const a of items) {
        // Main row
        const tr = document.createElement("tr");
        tr.className = "agent-row";

        const nameTd = document.createElement("td");
        nameTd.className = "agent-name-cell";
        const chevron = document.createElement("span");
        chevron.className = "row-chevron";
        chevron.textContent = "▶";
        const nameText = document.createElement("span");
        nameText.textContent = a.name;
        nameTd.appendChild(chevron);
        nameTd.appendChild(nameText);

        const model = document.createElement("td");
        model.textContent = a.model;
        const mem = document.createElement("td");
        mem.innerHTML = a.memory_enabled
          ? '<span class="bool-yes">Yes</span>'
          : '<span class="bool-no">No</span>';
        const created = document.createElement("td");
        created.textContent = new Date(a.created_at).toLocaleDateString();
        const actions = document.createElement("td");
        const editBtn = document.createElement("button");
        editBtn.className = "btn btn-secondary btn-sm";
        editBtn.textContent = "Edit";
        editBtn.addEventListener("click", (e) => { e.stopPropagation(); openEdit(a); });
        const delBtn = document.createElement("button");
        delBtn.className = "btn btn-danger btn-sm";
        delBtn.style.marginLeft = "6px";
        delBtn.textContent = "Delete";
        delBtn.addEventListener("click", (e) => { e.stopPropagation(); remove(a.id, a.name); });
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        tr.append(nameTd, model, mem, created, actions);

        // Detail row
        const detailTr = document.createElement("tr");
        detailTr.className = "agent-detail-row";
        const detailTd = document.createElement("td");
        detailTd.colSpan = 5;
        detailTd.className = "agent-detail-cell";

        const grid = document.createElement("div");
        grid.className = "agent-detail-grid";

        function detailField(label, value) {
          if (!value && value !== false) return;
          const block = document.createElement("div");
          block.className = "detail-field";
          const lbl = document.createElement("span");
          lbl.className = "detail-label";
          lbl.textContent = label;
          block.appendChild(lbl);
          const val = document.createElement("span");
          val.className = "detail-value";
          val.textContent = value;
          block.appendChild(val);
          grid.appendChild(block);
        }

        function detailBadges(label, items, labelMap) {
          if (!items || !items.length) return;
          const block = document.createElement("div");
          block.className = "detail-field";
          const lbl = document.createElement("span");
          lbl.className = "detail-label";
          lbl.textContent = label;
          block.appendChild(lbl);
          const wrap = document.createElement("span");
          wrap.className = "detail-badges";
          for (const item of items) {
            const badge = document.createElement("span");
            badge.className = "badge badge-purple";
            badge.textContent = labelMap ? (labelMap[item] || item) : item;
            wrap.appendChild(badge);
          }
          block.appendChild(wrap);
          grid.appendChild(block);
        }

        detailField("Role & Persona", a.role_persona);
        detailField("Description", a.description);
        detailField("System Prompt", a.system_prompt);
        detailBadges("Tools", a.tools);
        detailBadges("Channels", a.channels, CHANNEL_LABELS);

        if (!grid.childElementCount) {
          const empty = document.createElement("span");
          empty.className = "detail-empty";
          empty.textContent = "No additional details.";
          grid.appendChild(empty);
        }

        detailTd.appendChild(grid);
        detailTr.appendChild(detailTd);

        // Toggle expand on row click
        tr.addEventListener("click", () => {
          const expanded = tr.classList.toggle("expanded");
          chevron.classList.toggle("open", expanded);
          detailTr.classList.toggle("visible", expanded);
        });

        tbody.appendChild(tr);
        tbody.appendChild(detailTr);
      }
    }

    function updatePagination() {
      const from = total === 0 ? 0 : skip + 1;
      const to = Math.min(skip + LIMIT, total);
      pageInfo.textContent = `Showing ${from}–${to} of ${total}`;
      btnPrev.disabled = skip === 0;
      btnNext.disabled = skip + LIMIT >= total;
    }

    function openForm() {
      form.classList.add("visible");
    }

    function closeForm() {
      form.classList.remove("visible");
      form.reset();
      document.getElementById("form-agent-id").value = "";
      editingId = null;
      document.getElementById("form-submit-btn").textContent = "Create";
    }

    function openEdit(agent) {
      editingId = agent.id;
      document.getElementById("form-agent-id").value = agent.id;
      document.getElementById("f-name").value = agent.name;
      document.getElementById("f-role-persona").value = agent.role_persona || "";
      document.getElementById("f-model").value = agent.model;
      document.getElementById("f-description").value = agent.description || "";
      document.getElementById("f-system-prompt").value = agent.system_prompt || "";
      document.getElementById("f-tools").value = (agent.tools || []).join(", ");
      const selected = new Set(agent.channels || []);
      document.querySelectorAll("input[name='channel']").forEach((cb) => {
        cb.checked = selected.has(cb.value);
      });
      document.getElementById("f-memory").checked = agent.memory_enabled;
      document.getElementById("form-submit-btn").textContent = "Update";
      openForm();
      form.scrollIntoView({ behavior: "smooth" });
    }

    async function remove(id, name) {
      if (!confirm(`Delete agent "${name}"?`)) return;
      try {
        await deleteAgent(id);
        showToast("Agent deleted.");
        await load();
      } catch (e) {
        showToast(e.message, "error");
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const toolsRaw = document.getElementById("f-tools").value;
      const tools = toolsRaw.split(",").map((t) => t.trim()).filter(Boolean);
      const channels = [...document.querySelectorAll("input[name='channel']:checked")].map((cb) => cb.value);
      const payload = {
        name: document.getElementById("f-name").value.trim(),
        role_persona: document.getElementById("f-role-persona").value.trim() || null,
        model: document.getElementById("f-model").value.trim() || "claude-sonnet-4-6",
        description: document.getElementById("f-description").value.trim() || null,
        system_prompt: document.getElementById("f-system-prompt").value.trim() || null,
        tools,
        channels,
        memory_enabled: document.getElementById("f-memory").checked,
      };
      try {
        if (editingId) {
          await updateAgent(editingId, payload);
          showToast("Agent updated.");
        } else {
          await createAgent(payload);
          showToast("Agent created.");
        }
        closeForm();
        await load();
      } catch (e) {
        showToast(e.message, "error");
      }
    });

    document.getElementById("btn-new").addEventListener("click", () => {
      closeForm();
      openForm();
    });
    document.getElementById("btn-cancel").addEventListener("click", closeForm);
    btnPrev.addEventListener("click", () => { skip = Math.max(0, skip - LIMIT); load(); });
    btnNext.addEventListener("click", () => { skip += LIMIT; load(); });

    load();
  </script>
</body>
</html>
